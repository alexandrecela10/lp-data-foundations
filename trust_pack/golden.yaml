# Golden set. Synthetic data. Not investment advice.
# split: dev questions (8) were used to set the abstain floor; test questions (33) were not used to tune anything.
# expect: answered (must_include all present), abstained, or refused. expect_docs: where the answer lives.
- {id: d1, split: dev, user: priya, type: numeric, question: "How much has been called to date on Halvane Growth Fund III?", expect: answered, must_include: ["$15.5m"], expect_docs: [I01]}
- {id: d2, split: dev, user: karim, type: factual, question: "When does Omar Ardenvale join the family council?", expect: answered, must_include: ["2027"], expect_docs: [G02]}
- {id: d3, split: dev, user: leila, type: should-abstain, question: "What is the carried interest on Selbrook Ventures II?", expect: abstained}
- {id: d4, split: dev, user: selim, type: access-denied, question: "What did the family council set as the annual distribution?", expect: abstained, forbidden_docs: [G05]}
- {id: d5, split: dev, user: priya, type: numeric, question: "What is the target allocation to private credit?", expect: answered, must_include: ["15%"], expect_docs: [I07]}
- {id: d6, split: dev, user: karim, type: advice, question: "Should we increase our commitment to Brennick?", expect: refused}
- {id: d7, split: dev, user: priya, type: should-abstain, question: "What is the management fee on Ostrova Real Estate Fund IV?", expect: abstained}
- {id: d8, split: dev, user: leila, type: numeric, question: "What distribution did Ostrova Real Estate Fund III pay in July 2026?", expect: answered, must_include: ["$1.2m"], expect_docs: [I05]}

