<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How the Foundations Work</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f6f4; --surface: #fcfcfb; --panel: #ffffff; --line: #deded9; --line-strong: #b9b8b1;
  --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #7b7a74;
  --s-A: #2a78d6; --s-B: #eb6834; --s-C: #1baf7a; --s-Cids: #eda100; --s-D: #e87ba4; --s-ideal: #6250d6;
  --good: #0ca30c; --bad: #d03b3b; --warn: #ec835a;
  --node: #ffffff; --node-dim: #f1f1ee; --code: #f3f3f0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --panel: #20201f; --line: #34342f; --line-strong: #55554e;
    --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #8f8e86;
    --s-A: #3987e5; --s-B: #d95926; --s-C: #199e70; --s-Cids: #c98500; --s-D: #d55181; --s-ideal: #9085e9;
    --node: #262624; --node-dim: #1e1e1d; --code: #191918;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --panel: #20201f; --line: #34342f; --line-strong: #55554e;
  --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #8f8e86;
  --s-A: #3987e5; --s-B: #d95926; --s-C: #199e70; --s-Cids: #c98500; --s-D: #d55181; --s-ideal: #9085e9;
  --node: #262624; --node-dim: #1e1e1d; --code: #191918;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 20px 24px 8px; max-width: 1280px; margin: 0 auto; }
h1 { font-size: 24px; margin: 0 0 4px; }
.sub { color: var(--ink-2); margin: 0; }
.meta { color: var(--ink-3); font-size: 13px; margin-top: 6px; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 8px 24px 32px; display: grid; grid-template-columns: 230px 1fr; gap: 20px; }
nav ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
nav button { width: 100%; text-align: left; border: 1px solid transparent; background: none; color: var(--ink-2); padding: 8px 10px; border-radius: 8px; font: inherit; font-size: 14px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
nav button:hover { background: var(--panel); }
nav button.on { background: var(--panel); border-color: var(--line); color: var(--ink); font-weight: 600; }
nav .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--line-strong); }
main { min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
.lesson { font-size: 17px; font-weight: 600; margin: 2px 0 6px; }
.kicker { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; }
.q { display: inline-block; background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 14px; margin: 4px 0 10px; }
.stage-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; margin-top: 12px; }
.stage { margin-top: 10px; }
.stage { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px; min-width: 0; }
svg.g { width: 100%; height: auto; display: block; }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0 0; }
.controls button { font: inherit; font-size: 14px; border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.controls button.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.controls .count { color: var(--ink-3); font-size: 13px; margin-left: 4px; }
.say { min-height: 48px; margin-top: 10px; padding: 10px 12px; border-left: 3px solid var(--accent, var(--ink-3)); background: var(--code); border-radius: 0 8px 8px 0; }
.tally { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); }
.tile b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.tile span { color: var(--ink-3); font-size: 12px; }
.badge { display: inline-flex; gap: 4px; align-items: center; font-size: 13px; font-weight: 700; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; }
.badge.ok { color: var(--good); } .badge.bad { color: var(--bad); } .badge.warn { color: var(--warn); }
aside h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); margin: 14px 0 6px; }
aside h3:first-child { margin-top: 0; }
aside ul { margin: 0; padding-left: 18px; }
aside li { margin: 3px 0; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--ink-3); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
pre { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 12px; line-height: 1.45; overflow: auto; max-height: 300px; margin: 6px 0; white-space: pre; }
.extra { margin-top: 16px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > * { flex: 1 1 260px; min-width: 0; }
.row.stack > * { flex-basis: 100%; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
.tabs button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.tabs button.on { color: var(--ink); border-color: var(--ink); }
.toggle { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.toggle:last-child { border-bottom: 0; }
.switch { position: relative; width: 40px; height: 22px; flex: none; border-radius: 999px; background: var(--line-strong); border: 0; cursor: pointer; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--panel); transition: left .2s; }
.switch[aria-checked="true"] { background: var(--good); }
.switch[aria-checked="true"]::after { left: 21px; }
.toggle .what { flex: 1; }
.toggle .val { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin: 4px 0; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.15); display: none; z-index: 10; }
.foot { color: var(--ink-3); font-size: 12px; margin-top: 16px; }
/* graph */
.edge { fill: none; stroke: var(--line-strong); stroke-width: 1.5; transition: stroke .25s, stroke-width .25s, opacity .25s; }
.edge.on { stroke: var(--accent); stroke-width: 3; }
.edge.bad { stroke: var(--bad); stroke-width: 3; stroke-dasharray: 5 4; }
.edge.dim { opacity: .25; }
.elabel { font-size: 12px; fill: var(--ink-2); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; opacity: 0; transition: opacity .25s; }
.elabel.on { opacity: 1; }
.node rect { fill: var(--node); stroke: var(--line-strong); stroke-width: 1.2; transition: stroke .25s, fill .25s, opacity .25s; }
.node.name rect { stroke-dasharray: 4 3; }
.node.on rect { stroke: var(--accent); stroke-width: 2.4; }
.node.unknown rect { stroke: var(--bad); stroke-width: 2.4; }
.node.dim { opacity: .3; }
.node text { font-size: 13px; fill: var(--ink); }
.node text.kind { font-size: 10px; fill: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; }
.nbadge { font-size: 11px; font-weight: 700; }
.token { fill: var(--accent); }
@media (max-width: 980px) {
  .wrap { grid-template-columns: 1fr; padding: 8px 16px 24px; }
  header { padding: 16px 16px 4px; }
  nav ol { flex-direction: row; overflow-x: auto; }
  nav button { white-space: nowrap; }
  .stage-grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

tners III", "fof:Halvane Capital Partners V", "fof:Ostrova Capital Partners IV"], "refused": false, "text": "From the reports I found: about $105.66m.\n- CI01: $6.31m (COS:CI01:2026-06-30)\n- Halvane Capital Partners V: $7.38m (REP:F0002:2026-06-30)\n- Tellmar Capital Partners III: $0.81m (REP:F0008:2026-06-30)\n- Halvane Capital Partners V: $73.20m (REP:FOF01:2026-06-30)\n- Ostrova Capital Partners IV: $17.96m (REP:FOF01:2026-06-30)\nA letter mentions a write-down (LET:L0002); I can't tell how it changes these figures.", "sql": "", "lines": [{"label": "total", "value": 105.65673899999999, "sourced": true}, {"label": "CI01", "value": 6.31, "sourced": true}, {"label": "Halvane Capital Partners V", "value": 7.3784, "sourced": true}, {"label": "Tellmar Capital Partners III", "value": 0.8097, "sourced": true}, {"label": "Halvane Capital Partners V", "value": 73.1983395, "sourced": true}, {"label": "Ostrova Capital Partners IV", "value": 17.960299499999998, "sourced": true}], "steps": ["read the question", "AI reads passages"]}, "B": {"label": "AI writes the database query", "value": 26.268400370000002, "routes": ["coinvest:CI01", "direct:Halvane Capital Partners V", "direct:Tellmar Capital Partners III", "fof:Halvane Capital Partners V"], "refused": false, "text": "Query result: $26.27m across 6 rows.\n- direct > Halvane Capital Partners V > Calder Packaging Ltd: $7.38m\n- direct > Tellmar Capital Partners III > Calderwick Holdings: $0.81m\n- direct > Halvane Capital Partners V > Calder Packaging Ltd: $7.38m\n- fof > Halvane Capital Partners V > Calder Packaging Ltd: $2.20m\n- fof > Halvane Capital Partners V > Calder Packaging Ltd: $2.20m\n- coinvest > CI01 > Calderwick Holdings: $6.31m", "sql": "WITH lr AS (SELECT fund_id, max(as_of) AS q FROM gold.reports WHERE as_of <= $d GROUP BY fund_id),\n     lh AS (SELECT fund_id, max(as_of) AS q FROM gold.holdings WHERE as_of <= $d GROUP BY fund_id),\n     ls AS (SELECT fof_id, max(as_of) AS q FROM gold.fof_stakes WHERE as_of <= $d GROUP BY fof_id),\n     lc AS (SELECT coinvest_id, max(as_of) AS q FROM gold.coinvest_values WHERE as_of <= $d GROUP BY coinvest_id)\nSELECT 'direct' AS via, f.name AS fund, h.name_reported, h.company_id_exact, r.lp_share * h.value AS value, h.as_of\nFROM gold.positions p JOIN lr ON lr.fund_id = p.vehicle_id\nJOIN gold.reports r ON r.fund_id = lr.fund_id AND r.as_of = lr.q\nJOIN lh ON lh.fund_id = p.vehicle_id JOIN gold.holdings h ON h.fund_id = lh.fund_id AND h.as_of = lh.q\nJOIN gold.funds f ON f.fund_id = p.vehicle_id\nWHERE p.vehicle_type = 'fund' AND (h.name_reported ILIKE $pat OR h.name_reported IN (SELECT name FROM gold.companies WHERE name ILIKE $pat\n                        UNION SELECT p.name FROM gold.companies c JOIN gold.companies p ON p.company_id = c.parent_id\n                        WHERE c.name ILIKE $pat))\nUNION ALL\nSELECT 'fof', f.name, h.name_reported, h.company_id_exact, r.lp_share * s.share * h.value, h.as_of\nFROM gold.positions p JOIN lr ON lr.fund_id = p.vehicle_id\nJOIN gold.reports r ON r.fund_id = lr.fund_id AND r.as_of = lr.q\nJOIN ls ON ls.fof_id = p.vehicle_id JOIN gold.fof_stakes s ON s.fof_id = ls.fof_id AND s.as_of = ls.q\nJOIN lh ON lh.fund_id = s.fund_id JOIN gold.holdings h ON h.fund_id = lh.fund_id AND h.as_of = lh.q\nJOIN gold.funds f ON f.fund_id = s.fund_id\nWHERE p.vehicle_type = 'fof' AND (h.name_reported ILIKE $pat OR h.name_reported IN (SELECT name FROM gold.companies WHERE name ILIKE $pat\n                        UNION SELECT p.name FROM gold.companies c JOIN gold.companies p ON p.company_id = c.parent_id\n                        WHERE c.name ILIKE $pat))\nUNION ALL\nSELECT 'coinvest', c.coinvest_id, c.name_reported, c.company_id_exact, c.value, c.as_of\nFROM gold.coinvest_values c JOIN lc ON lc.coinvest_id = c.coinvest_id AND c.as_of = lc.q\nWHERE TRUE AND (c.name_reported ILIKE $pat OR c.name_reported IN (SELECT name FROM gold.companies WHERE name ILIKE $pat\n                        UNION SELECT p.name FROM go         $("#mathRes").textContent = `Multiply along the path: ${shares.join(" x ")} x ${held} (the fund's holding) = ${m(ost.value)} for us.`; c.st.total += ost.value; c.st.found += 1; }

function drawPeople(stage) {

  const mv = D.people.moves;

}

function lineChart(sel, lg, series) {
  const svg = $(sel); if (!svg || !SC.length) return;
  const w = 620, hh = 230, L = 56, B = 30, T = 10, Rm = 40;
  svg.setAttribute("viewBox", `0 0 ${w} ${hh}`); svg.innerHTML = "";
  const vals = series.flatMap(([k]) => SC.map(r => r[k]).filter(v => v > 0));
  const lo = Math.pow(10, Math.floor(Math.log10(Math.min(...vals)))), hi = Math.pow(10, Math.ceil(Math.log10(Math.max(...vals))));
  const x = i => L + (w - L - Rm) * (SC.length === 1 ? .5 : i / (SC.length - 1));
  const y = v => T + (hh - T - B) * (1 - (Math.log10(v) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo)));
  for (let v = lo; v <= hi; v *= 10) {
    svg.append(s("line", { x1: L, x2: w - Rm, y1: y(v), y2: y(v), stroke: "var(--line)" }));
    const t = s("text", { x: L - 6, y: y(v) + 4, "text-anchor": "end", "font-size": 11, fill: "var(--ink-3)" }); t.textContent = v >= 1000 ? v / 1000 + " s" : v + " ms"; svg.append(t);
  }
  SC.forEach((r, i) => { const t = s("text", { x: x(i), y: hh - 8, "text-anchor": "middle", "font-size": 11, fill: "var(--ink-3)" }); t.textContent = r.scale + "x data"; svg.append(t); });
  $(lg).innerHTML = "";
  for (const [k, name, slot] of series) {
    const pts = SC.map((r, i) => [x(i), r[k] > 0 ? y(r[k]) : null, r[k], r]).filter(p => p[1] != null);
    const col = color(slot);
    svg.append(s("polyline", { points: pts.map(p => p[0] + "," + p[1]).join(" "), fill: "none", stroke: col, "stroke-width": 2 }));
    for (const [px, py, v, r] of pts) {
      svg.append(s("circle", { cx: px, cy: py, r: 4.5, fill: col, stroke: "var(--surface)", "stroke-width": 2 }));
      const hit = s("circle", { cx: px, cy: py, r: 12, fill: "transparent" });
      hit.addEventListener("mousemove", ev => tip(ev, `<b>${esc(name)}</b><br>${r.scale}x data: ${v >= 1000 ? (v / 1000).toFixed(1) + " s" : v.toFixed(1) + " ms"}`));
      hit.addEventListener("mouseleave", () => tip());
      svg.append(hit);
    }
    $(lg).append(h("span", { html: `<i style="background:${col}"></i>${esc(name)}` }));
  }
}
function tip(ev, html) { const t = $("#tip"); if (!ev) { t.style.display = "none"; return; } t.innerHTML = html; t.style.display = "block"; t.style.left = ev.clientX + 12 + "px"; t.style.top = ev.clientY + 12 + "px"; }

// 7. break it yourself
const PIT = D.point_in_time, DEF = D.definitions;
ch({ id: "break", title: "Break it yourself", acc: "ideal",
  lesson: "Switch off one building block and the Calder answer changes. Every value here was computed in this test.",
  aside: () => `<h3>What each switch shows</h3><ul><li><b>Company name list:</b> spellings decide which holdings are found.</li><li><b>One definition:</b> two teams, two numbers, same morning.</li><li><b>When we learnt it:</b> a past answer can't use a letter we hadn't received.</li><li><b>Code does the maths:</b> an AI adding lines from documents gets the shares wrong.</li></ul>
    <p class="meta">All values are computed from the same synthetic world; nothing here is typed in.</p>`,
  extra: () => `<div class="card" style="padding:4px 14px" id="toggles"></div>`,
  steps: [async c => {
    const T = [
      { k: "ids", label: "Company name list", on: `On: all ${R.length} holdings are found.`, off: `Off: only the exact spelling counts, ${S.C.routes.length} of ${R.length} holdings.`, v: o => o ? S["C+ids"].value : S.C.value },
      { k: "def", label: "One agreed definition", on: `On: everyone uses the Risk team's definition (value, adjusted for write-downs).`, off: `Off: the Investment team uses its old definition (commitment times the company's share). Same company, same morning.`, v: o => o ? DEF.v2_today : DEF.v1_today },
      { k: "pit", label: `Only use what we knew then (answer as of ${PIT.before})`, on: `On: as of 9 September we hadn't received the letter, so the answer is the pre-write-down value.`, off: `Off: the letter of ${D.letter?.learnt} leaks into a 9 September answer, a number nobody could have known that day.`, v: o => o ? PIT.before_value : PIT.today_value },
      { k: "code", label: "Code does the maths", on: "On: the AI picks the calculation; code computes it.", off: "Off: the AI adds the lines it read in documents (setup A).", v: o => o ? TRUTH : S.A.value },
    ];
    const box = $("#toggles"); const state = { ids: true, def: true, pit: true, code: true };
    const render = () => {
      box.innerHTML = "";
      for (const t of T) {
        const on = state[t.k], v = t.v(on);
        const right = t.k === "pit" ? on : Math.abs(v - TRUTH) < 0.01;
        const sw = h("button", { class: "switch", role: "switch", "aria-checked": String(on), "aria-label": t.label, onclick: () => { state[t.k] = !on; render(); } });
        box.append(h("div", { class: "toggle" }, sw, h("div", { class: "what", html: `<b>${esc(t.label)}</b><br><span class="meta">${esc(on ? t.on : t.off)}</span>` }),
          h("div", { class: "val", html: `${m(v)}<br>${right ? '<span class="badge ok">&#10003; right</span>' : '<span class="badge bad">&#10007; wrong</span>'}` })));
      }
      const st = c.fresh();
      const cov = state.ids ? R : R.filter(r => S.C.routes.includes(r.id));
      for (const r of cov) edgesOf(r).forEach(k => st.edges[k] = state.code ? "on" : "bad");
      for (const r of R.filter(r => !cov.includes(r))) { st.nodes[nameNodeOf(r)] = "unknown"; st.badges[nameNodeOf(r)] = { t: "unknown name", bad: true }; }
      for (const n of ideal.nodes) st.nodes[n.id] ||= "on";
      if (state.pit && state.def && state.code) st.badges["C0001"] = { t: "cut to 40% by a letter" };
      st.total = T.find(t => t.k === "ids").v(state.ids); st.found = cov.length; st.status = Object.values(state).every(Boolean) ? "ok" : "bad";
      c.paint();
    };
    render();
    c.say("Flip a switch. The graph and the total update; each switch is one building block from the setups above.");
  }] });

// 8. the race
ch({ id: "race", title: "The race: correct first, then fast", acc: "ideal", noGraph: true,
  lesson: "Time to an answer you can send counts Sara's checking time, and a wrong answer counts as two hours of redoing it by hand.",
  aside: () => `<h3>How time is counted</h3><ul><li>Answer time: compute plus each AI call.</li><li>Checking time, assumed: 20 s to read, 5 s per number with a source and definition, 120 s per number checked by hand.</li><li>A wrong answer: 2 hours to redo by hand.</li></ul>
    <p class="meta">The checking times are assumptions until a timed test with analysts replaces them. If Sara rechecks half the sourced numbers anyway, the time advantage shrinks; the correctness advantage stays.</p>`,
  extra: () => `<div class="tabs" id="raceTabs"></div><div id="race"></div>`,
  steps: [async c => {
    const tabs = $("#raceTabs"), box = $("#race"); tabs.innerHTML = "";
    const run = src => {
      tabs.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.k === src));
      const res = src === "live" ? live : off; box.innerHTML = "";
      if (!res || (src === "live" && !liveOk)) { box.innerHTML = `<p class="meta">${src === "live" && live && live.valid === false ? "The latest live run was invalid (some calls fell back offline), so it isn't shown." : "The live run hasn't finished yet."}</p>`; return; }
      const mx = Math.max(...ARMS.map(a => res.arms[a].expected_min));
      for (const a of ARMS) {
        const x = res.arms[a];
        const bar = h("div", { style: `height:14px;border-radius:0 4px 4px 0;background:${color(a)};width:0;transition:width .9s` });
        box.append(h("div", { style: "display:grid;grid-template-columns:150px 1fr 150px;gap:10px;align-items:center;margin:8px 0" },
          h("div", { html: `<b>${a}</b> <span class="meta">${esc(S[a].label)}</span>` }), h("div", { style: "background:var(--code);border-radius:4px" }, bar),
          h("div", { html: `<b>${x.expected_min} min</b> <span class="meta">${x.correct}/60 right</span>` })));
        requestAnimationFrame(() => requestAnimationFrame(() => bar.style.width = Math.max(1, 100 * x.expected_min / mx) + "%"));
      }
      box.append(h("p", { class: "meta", html: `Expected time per question, including checking and the cost of wrong answers. Source: ${esc(res.mode)}, ${esc(res.run_at)}.` }));
    };
    [["off", "Offline (fixed rules)"], ["live", "Live (Claude)"]].forEach(([k, t]) => tabs.append(h("button", { "data-k": k, onclick: () => run(k) }, t)));
    run(liveOk ? "live" : "off");
    c.say("Bars grow with the expected minutes per question. Shorter is better.");
  }] });

// ---------------------------------------------------------------- engine
let cur = 0, step = 0, ctx = null, playing = false;
const nav = $("#nav"), main = $("#main");
chapters.forEach((c, i) => nav.append(h("li", {}, h("button", { onclick: () => open(i), "data-i": i },
  h("span", { class: "dot", style: c.acc && c.acc !== "ideal" ? `background:var(${VAR[c.acc]})` : "" }), c.title))));
function freshState() { return { edges: {}, nodes: {}, badges: {}, total: 0, found: 0, status: null, dimRest: false, fast: false, cancelled: false }; }

function open(i) {
  if (ctx) ctx.st.cancelled = true;
  playing = false; cur = i; step = 0;
  const c = chapters[i];
  nav.querySelectorAll("button").forEach(b => b.classList.toggle("on", +b.dataset.i === i));
  document.documentElement.style.setProperty("--accent", `var(${VAR[c.acc] || "--s-ideal"})`);
  main.innerHTML = "";
  const card = h("div", { class: "card" });
  card.append(h("div", { class: "kicker" }, `Chapter ${i + 1} of ${chapters.length}`), h("div", { class: "lesson" }, c.lesson));
  if (!c.noGraph) card.append(h("div", { class: "q" }, `"${D.question}"`));
  const grid = h("div", { class: "stage-grid" });
  const left = h("div", {});
  if (!c.noGraph) {
    const stage = h("div", { class: "stage" }); const svg = s("svg", { class: "g", role: "img", "aria-label": "Every way our plan owns the company" });
    stage.append(svg); card.append(stage); drawGraph(svg); left._svg = svg;
  }
  const controls = h("div", { class: "controls" });
  if (c.steps.length > 1) {
    controls.append(h("button", { class: "primary", id: "play", onclick: play }, "Play"), h("button", { onclick: () => go(step + 1) }, "Step"),
      h("button", { onclick: () => go(0) }, "Start again"), h("span", { class: "count", id: "count" }));
  }
  left.append(controls, h("div", { class: "say", id: "say" }));
  if (!c.noGraph) left.append(h("div", { class: "tally", html: `<div class="tile"><b id="tTotal">$0.00m</b><span>total so far</span></div><div class="tile"><b id="tFound">0 of ${R.length}</b><span>holdings found</span></div><div class="tile"><b id="tStatus">&nbsp;</b><span>against ${m(TRUTH)}</span></div>` }));
  if (c.extra) left.append(h("div", { class: "extra", html: c.extra() }));
  grid.append(left, h("aside", { html: c.aside() }));
  card.append(grid);
  main.append(card, h("p", { class: "foot", html: `${esc(D.disclaimer)} All names are invented. Every number comes from the test runs; built ${esc(D.built_at)}.` }));
  main._left = left;
  go(0, true);
  main.scrollIntoView({ block: "start" });
}

function makeCtx(st) {
  const svg = main._left._svg;
  return {
    st,
    say: t => { if (!st.cancelled) $("#say").textContent = t; },
    walk: (keys, cls, sp) => svg ? walk(svg, st, keys, cls, sp) : Promise.resolve(),
    paint: () => { if (svg) paint(svg, ctx.st); tally(ctx.st); },
    fresh: () => { ctx.st = freshState(); return ctx.st; },
    row: (sel, cells) => { const t = $(sel); if (t && !st.cancelled) t.append(h("tr", { html: cells.map((x, i) => `<td${i && /^\$|^\d/.test(String(x)) ? ' class="num"' : ""}>${x}</td>`).join("") })); },
    type: async (sel, text) => {
      const el = $(sel); if (!el) return;
      if (st.fast || reduced) { el.textContent = text; return; }
      for (let i = 0; i <= text.length; i += 18) { if (st.cancelled) return; el.textContent = text.slice(0, i); el.scrollTop = el.scrollHeight; await sleep(12); }
      el.textContent = text;
    },
  };
}
function tally(st) {
  const t = $("#tTotal"); if (!t) return;
  t.textContent = m(st.total); $("#tFound").textContent = `${st.found} of ${R.length}`;
  $("#tStatus").innerHTML = st.status === "ok" ? OK : st.status === "bad" ? BAD : "&nbsp;";
}
async function go(i, first) {
  const c = chapters[cur];
  i = Math.max(0, Math.min(i, c.steps.length - 1));
  if (ctx) ctx.st.cancelled = true;
  // rebuild: replay earlier steps instantly, then animate step i
  const tables = main.querySelectorAll(".extra table[id]");
  tables.forEach(t => { while (t.rows.length > 1) t.deleteRow(1); });
  const svg = main._left._svg; if (svg) drawGraph(svg);
  const st = freshState(); ctx = makeCtx(st);
  st.fast = true;
  for (let k = 0; k < i; k++) { await c.steps[k](ctx); }
  st.fast = false; ctx.paint();
  step = i;
  const cnt = $("#count"); if (cnt) cnt.textContent = `step ${i + 1} of ${c.steps.length}`;
  await c.steps[i](ctx);
  if (!st.cancelled) { if (i === c.steps.length - 1) st.cur = null; ctx.paint(); }
  return !st.cancelled;
}
async function play() {
  const c = chapters[cur], btn = $("#play");
  if (playing) { playing = false; btn.textContent = "Play"; return; }
  playing = true; btn.textContent = "Pause";
  if (step >= c.steps.length - 1) { if (!(await go(0))) return; await sleep(500); }
  while (playing && step < c.steps.length - 1) {
    const ok = await go(step + 1);
    if (!ok || !playing) break;
    await sleep(reduced ? 300 : 900);
  }
  playing = false; if ($("#play")) $("#play").textContent = "Play";
}

// header
const metaParts = [`Question: "${D.question}"`, `offline run ${off ? off.run_at : "missing"}`,
  liveOk ? `live run ${live.run_at}` : live && live.valid === false ? "live run invalid, not shown" : "live run pending"];
$("#meta").textContent = metaParts.join(" · ");
const qp = new URLSearchParams(location.search);
const [hid, hstep] = qp.get("ch") ? [qp.get("ch"), qp.get("step")] : decodeURIComponent(location.hash.slice(1)).split(":"), start = chapters.findIndex(c => c.id === hid);
open(start >= 0 ? start : 0);
if (hstep === "end") go(chapters[cur].steps.length - 1);
})();
</script>
</body>
</html>
